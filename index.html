<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscar Factura</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,.1);
      border-radius: 12px;
    }

    h1 {
      text-align: center;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
    }

    button {
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <div class="app">
    <h1>Buscar factura</h1>
    <input type="text" placeholder="Ingresa número de factura" />
    <button>Buscar</button>
  </div>
</body>
</html>
